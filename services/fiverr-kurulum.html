<title>Fiverr Kurulum Paneli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column of steps; each Fiverr form field is a row with a copy button */
:root{--bg:#F6F4EE;--card:#FFFFFF;--ink:#13212E;--muted:#5E6873;--line:#DED9CC;--accent:#B9851F;--ok:#1C8A5E;--okbg:#DDF3E9;
--f-body:Inter,system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171F;--card:#18222D;--ink:#EEF1F4;--muted:#9AA6B2;--line:#2A3846;--accent:#F2B33D;--ok:#3CC48C;--okbg:#173A2C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171F;--card:#18222D;--ink:#EEF1F4;--muted:#9AA6B2;--line:#2A3846;--accent:#F2B33D;--ok:#3CC48C;--okbg:#173A2C;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;text-wrap:balance;margin:0}
.lead{color:var(--muted);margin:0}
.progress{display:flex;align-items:center;gap:12px;font-weight:600}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font-weight:700}
summary::-webkit-details-marker{display:none}
.num{flex:none;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px;font-weight:800}
details.done .num{background:var(--ok)}
.sum-t{flex:1;min-width:0}.sum-t small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.val{white-space:pre-wrap;word-break:break-word;font-size:14px;min-width:0}
.val.mono{font-family:var(--f-mono);font-size:13px}
button.copy{flex:none;font:600 13px var(--f-body);border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:6px 14px;cursor:pointer;min-height:34px}
button.copy.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pkc{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pkc b{font-size:13px}
@media (max-width:560px){.pk{grid-template-columns:1fr}}
.mini{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.mini span{min-width:0;word-break:break-word}
.mini button.copy{padding:4px 10px;min-height:30px;font-size:12px}
.tip{background:var(--okbg);border-radius:10px;padding:10px 12px;font-size:14px}
.done-btn{align-self:flex-start;font:700 14px var(--f-body);border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--bg);cursor:pointer}
details.done .done-btn{background:var(--ok);color:#fff}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<div class="wrap">
  <h1>Fiverr Kurulum Paneli</h1>
  <p class="lead">Her alanın yanındaki <b>Kopyala</b>'ya bas, Fiverr'daki aynı alana yapıştır. Bitirdiğin adımı "Tamamlandı" ile işaretle.</p>
  <div class="progress"><div class="bar"><i id="barfill"></i></div><span id="count">0/9</span></div>
  <div id="steps"></div>
</div>
<script>
const D = {"profile": {"Kullanıcı adı (kalıcı)": "rowwisedata", "Display name": "Rowwise Data", "One-liner": "Excel, data & automation — fixed, tested, delivered fast", "About": "I help small businesses and teams get their data right. Messy exports, broken formulas, slow manual reports — I clean them, automate them and check every total before delivery.\n\nWhat I do: Excel & Google Sheets fixes, dashboards, Python automation, PDF-to-Excel conversion, product listings in English & Turkish, landing pages and presentations.\n\nEvery order includes a short note explaining what I changed. Clear communication, fast replies, no surprises.", "Skills": "Microsoft Excel, Google Sheets, Data Cleaning, Power Query, Python, Data Entry, Dashboards, Translation, Web Design, PowerPoint"}, "gigs": [{"n": 1, "name": "Data cleaning & automation", "title": "clean, fix and automate your Excel or Google Sheets data", "category": "Programming & Tech › Data › Data Processing", "tags": "excel, google sheets, data cleaning, excel automation, power query", "desc": "Message me before ordering: free scope check and a fixed price.\n\nMessy export? Broken formulas? Numbers that don't add up?\n\nI fix spreadsheets so the totals are right, and stay right.\n\nWHAT I DO\n- Remove duplicates, fix dates, trim spaces, convert numbers stored as text\n- Repair VLOOKUP / XLOOKUP / SUMIFS / pivot table errors\n- Automate repeat work with Power Query, formulas, VBA or Google Apps Script\n- Add checks that flag bad data before it reaches your report\n\nEVERY DELIVERY INCLUDES\n- The fixed file\n- A short log of what was wrong and what I changed\n- Verified totals (I recalculate and check against your original)\n\nSend me your file (sample or dummy data is fine) and the result you need. I'll reply with a clear, fixed quote.", "packages": [{"tier": "Basic", "name": "Quick fix", "desc": "1 sheet ≤1,000 rows or up to 5 formulas", "delivery": "2 days", "revisions": "1", "price": "20"}, {"tier": "Standard", "name": "Clean + automate", "desc": "Up to 10,000 rows + 1 automation", "delivery": "3 days", "revisions": "2", "price": "50"}, {"tier": "Premium", "name": "Full workflow", "desc": "Multi-file workflow + automation + checks + guide", "delivery": "5 days", "revisions": "3", "price": "120"}], "image": "gig1-clean-automate.png"}, {"n": 2, "name": "Dashboards", "title": "build an Excel or Google Sheets dashboard from your business data", "category": "Programming & Tech › Data › Dashboards", "tags": "excel dashboard, google sheets dashboard, sales dashboard, kpi dashboard, data visualization", "desc": "Message me before ordering: free scope check and a fixed price.\n\nTurn raw sales, inventory or finance data into a one-page dashboard you can actually use.\n\nWHAT YOU GET\n- KPIs: revenue, orders, average order value, stock levels and more\n- Charts by month, region, product or sales rep\n- A clean data model underneath, so next month's data drops right in\n- Excel or Google Sheets, your choice\n\nHOW IT WORKS\n1. Send your data (a sample is fine) and the questions you want answered\n2. I clean the data and build the dashboard\n3. You get the file plus a short guide on updating it\n\nSample in my portfolio: a messy 438-row export cleaned to 420 rows, with a dashboard and a full cleaning log.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "4 KPIs + 2 charts (clean data)", "delivery": "3 days", "revisions": "1", "price": "30"}, {"tier": "Standard", "name": "Standard", "desc": "Cleaning + 6 KPIs + 4 charts + filters", "delivery": "4 days", "revisions": "2", "price": "75"}, {"tier": "Premium", "name": "Premium", "desc": "Automated refresh + multi-sheet dashboard + guide", "delivery": "6 days", "revisions": "3", "price": "180"}], "image": "gig2-dashboard.png"}, {"n": 3, "name": "Python automation", "title": "write a Python script to automate your CSV and Excel tasks", "category": "Programming & Tech › Software Development › Scripting (or Data Processing)", "tags": "python automation, python script, excel automation, csv, data processing", "desc": "Message me before ordering: free scope check and a fixed price.\n\nDoing the same copy-paste every week? I'll write a Python script that does it for you.\n\nTYPICAL JOBS\n- Merge and clean dozens of CSV or Excel files into one report\n- Reformat, deduplicate, split or combine data\n- Generate formatted Excel reports automatically\n- Pull data from public APIs or websites (where their terms allow it)\n\nYOU GET\n- A tested script, run on your sample data\n- Plain-English instructions to run it on Windows or Mac\n- Comments in the code so anyone can maintain it\n\nMessage me with the task and a sample file, and I'll confirm the approach and price before we start.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "1 task, 1 input format", "delivery": "2 days", "revisions": "1", "price": "30"}, {"tier": "Standard", "name": "Standard", "desc": "Multi-step script + Excel output", "delivery": "4 days", "revisions": "2", "price": "80"}, {"tier": "Premium", "name": "Premium", "desc": "Full pipeline + scheduling guide + docs", "delivery": "6 days", "revisions": "3", "price": "180"}], "image": "gig3-python.png"}, {"n": 4, "name": "PDF to Excel / data entry", "title": "convert PDF, scanned or image data to clean Excel accurately", "category": "Data › Data Entry", "tags": "pdf to excel, data entry, pdf conversion, invoice to excel, excel data entry", "desc": "Message me before ordering: free scope check and a fixed price.\n\nInvoices, price lists, statements, reports: I turn PDFs into clean, usable Excel tables.\n\nWHY ME\n- Every number is checked: I verify quantities x prices = totals and match grand totals to the source\n- Consistent columns, real numbers and dates (not text), ready for formulas and pivots\n- Large batches handled with automated extraction plus manual review\n\nYOU GET\n- One clean Excel table (or one sheet per document, your choice)\n- A check sheet showing the totals match the PDFs\n- Notes on anything unclear in the source\n\nScanned or handwritten files: send a sample first so I can confirm readability.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "Up to 20 pages", "delivery": "1 day", "revisions": "1", "price": "10"}, {"tier": "Standard", "name": "Standard", "desc": "Up to 75 pages", "delivery": "2 days", "revisions": "2", "price": "30"}, {"tier": "Premium", "name": "Premium", "desc": "Up to 200 pages + checks + cleanup", "delivery": "4 days", "revisions": "2", "price": "70"}], "image": "gig4-pdf-to-excel.png"}, {"n": 5, "name": "Product listings EN/TR", "title": "write product listings in English and Turkish for Amazon or Trendyol", "category": "Writing & Translation › Product Descriptions", "tags": "product description, amazon listing, etsy listing, turkish translation, shopify", "desc": "Message me before ordering: free scope check and a fixed price.\n\nClear, keyword-rich product listings that answer buyers' questions and fit each marketplace's rules.\n\nWHAT I WRITE\n- SEO title, 5 bullet points, description and backend search terms\n- Amazon, Etsy, Shopify, eBay, plus Trendyol and Hepsiburada in Turkish\n- English to Turkish or Turkish to English listing localisation (native Turkish speaker)\n\nHOW I WORK\n- You send product details, photos or your current listing\n- I research keywords and competitors, then write\n- Facts only: I don't invent features, materials or certifications\n\nBulk catalogues welcome: ask for a custom offer.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "1 product, 1 language", "delivery": "1 day", "revisions": "2", "price": "15"}, {"tier": "Standard", "name": "Standard", "desc": "3 products, 1 language (or 1 product EN+TR)", "delivery": "2 days", "revisions": "2", "price": "40"}, {"tier": "Premium", "name": "Premium", "desc": "10 products, 1 language", "delivery": "4 days", "revisions": "2", "price": "110"}], "image": "gig5-listings.png"}, {"n": 6, "name": "Landing page", "title": "build a fast, responsive landing page website for your business", "category": "Programming & Tech › Website Development › Landing Pages", "tags": "landing page, website design, responsive website, html css, small business website", "desc": "Message me before ordering: free scope check and a fixed price.\n\nA clean, fast one-page website that looks great on phones and desktops.\n\nINCLUDED\n- Custom design in your brand colours and fonts\n- Mobile-first, fast-loading code (no heavy page builders)\n- Sections for your offer, products, testimonials, FAQ and contact\n- Basic SEO: titles, descriptions, headings and social-share preview\n- Free hosting setup on Netlify, Cloudflare Pages or GitHub Pages (you own the account)\n\nNOT INCLUDED\n- WordPress, Wix or Shopify theme work\n- Online payments or user accounts\n\nSend me your business, your goal (calls, bookings, sales) and any examples you like.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "1 page, 3 sections", "delivery": "3 days", "revisions": "1", "price": "60"}, {"tier": "Standard", "name": "Standard", "desc": "1 page, 6 sections + contact form + SEO", "delivery": "5 days", "revisions": "2", "price": "140"}, {"tier": "Premium", "name": "Premium", "desc": "Up to 3 pages + form + SEO + hosting setup", "delivery": "7 days", "revisions": "3", "price": "300"}], "image": "gig6-landing-page.png"}, {"n": 7, "name": "Presentations", "title": "design a professional PowerPoint presentation or pitch deck", "category": "Graphics & Design › Presentation Design", "tags": "powerpoint, pitch deck, presentation design, business presentation, slides", "desc": "Message me before ordering: free scope check and a fixed price.\n\nClear, modern slides that make your message easy to follow.\n\nWHAT YOU GET\n- Fully editable PowerPoint (.pptx); Google Slides on request\n- Consistent layout in your brand colours and fonts\n- Charts built from your real numbers, not stock images of charts\n- Tightened wording: one idea per slide\n\nGOOD FOR\n- Pitch decks, sales decks, company profiles, reports and training\n\nSend your draft, outline or notes. I'll turn them into a deck you're proud to present.", "packages": [{"tier": "Basic", "name": "Basic", "desc": "Up to 8 slides", "delivery": "2 days", "revisions": "1", "price": "25"}, {"tier": "Standard", "name": "Standard", "desc": "Up to 15 slides + charts", "delivery": "3 days", "revisions": "2", "price": "60"}, {"tier": "Premium", "name": "Premium", "desc": "Up to 25 slides + charts + speaker notes", "delivery": "5 days", "revisions": "3", "price": "120"}], "image": "gig7-presentations.png"}], "faq": [["Is my data safe?", "I only use your files for your order and delete them after delivery. Sample or dummy data is welcome."], ["Do you use AI tools?", "Yes, to work faster. Every result is checked and tested by me before delivery."], ["Can we talk on a call?", "I work through Fiverr messages so everything is written down and clear."]], "reqs": ["Please upload your file or a sample (dummy data is fine).", "What result do you need? Describe it or share an example.", "What is your deadline, and which software/version do you use (Excel, Google Sheets, etc.)?"]};
const store = {get(){try{return JSON.parse(localStorage.getItem('fvr-done')||'{}')}catch(e){return {}}},
  set(v){try{localStorage.setItem('fvr-done',JSON.stringify(v))}catch(e){}}};
let done = store.get();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let clip = [];
function cbtn(text, small){ clip.push(text); return `<button class="copy" data-i="${clip.length-1}">Kopyala</button>`; }
function fieldRow(label, text, mono){ return `<div class="f"><div class="fh"><span class="lab">${label}</span>${cbtn(text)}</div><div class="val${mono?' mono':''}">${esc(text)}</div></div>`; }
function mini(label, text){ return `<div class="mini"><span><span class="lab">${label}</span> ${esc(text)}</span>${cbtn(text)}</div>`; }
function step(id, num, title, sub, inner){
  return `<details id="${id}" class="${done[id]?'done':''}"><summary><span class="num">${num}</span><span class="sum-t">${esc(title)}<small>${esc(sub)}</small></span></summary>
  <div class="body">${inner}<button class="done-btn" data-step="${id}">${done[id]?'✓ Tamamlandı':'Tamamlandı olarak işaretle'}</button></div></details>`;
}
let h = '';
h += step('s-account', 'A', 'Hesap ve profil', 'Kayıt ol → Become a Seller → profil alanları',
  `<div class="tip">fiverr.com'u Safari'de aç, "aA" → <b>Masaüstü Sitesini İste</b>. Profil fotoğrafı: yüzünün net göründüğü gerçek bir fotoğraf. Telefon ve kimlik doğrulamasını Fiverr isterse yap.</div>` +
  Object.entries(D.profile).map(([k,v]) => fieldRow(k, v, k.startsWith('Kullanıcı'))).join('') +
  fieldRow('Languages', 'Turkish — Native\nEnglish — Fluent'));
D.gigs.forEach(g => {
  let inner = `<div class="tip">Görsel: <b>${g.image}</b> (sohbette gönderildi). Fiverr başlığın başına "I will" yazısını kendisi koyar; aşağıdakini devamına yapıştır.</div>`;
  inner += fieldRow('1 · Title (I will …)', g.title);
  inner += fieldRow('1 · Category', g.category);
  inner += fieldRow('1 · Search tags (tek tek gir)', g.tags.split(',').map(s=>s.trim()).join('\n'), true);
  inner += `<div class="f"><span class="lab">2 · Pricing — "3 packages" aç</span><div class="pk">` + g.packages.map(p =>
    `<div class="pkc"><b>${p.tier}</b>${mini('Ad', p.name)}${mini('Açıklama', p.desc)}${mini('Teslim', p.delivery)}${mini('Revizyon', p.revisions)}${mini('Fiyat $', p.price)}</div>`).join('') + `</div></div>`;
  inner += fieldRow('3 · Description', g.desc);
  inner += D.faq.map((q,i) => fieldRow(`3 · FAQ ${i+1} soru`, q[0]) + fieldRow(`3 · FAQ ${i+1} cevap`, q[1])).join('');
  inner += D.reqs.map((r,i) => fieldRow(`4 · Requirement ${i+1}`, r)).join('');
  inner += `<div class="tip">5 · Gallery'ye <b>${g.image}</b> yükle → 6 · <b>Publish</b>.</div>`;
  h += step('g'+g.n, g.n, g.name, '$' + g.packages.map(p=>p.price).join(' / $'), inner);
});
h += step('s-pay', '✓', 'Ödeme ve bildirimler', 'Payoneer + Fiverr uygulaması',
  `<div class="tip">Profil → Earnings → Withdrawal: <b>Payoneer</b> bağla. Fiverr uygulamasını kur, <b>bildirimleri aç</b>, durumunu Online tut. Mesaj gelince ekran görüntüsünü bana gönder.</div>`);
document.getElementById('steps').innerHTML = h;
document.getElementById('steps').style.cssText = 'display:flex;flex-direction:column;gap:12px';
const ids = ['s-account', ...D.gigs.map(g=>'g'+g.n), 's-pay'];
function prog(){ const n = ids.filter(i=>done[i]).length; document.getElementById('count').textContent = n + '/' + ids.length;
  document.getElementById('barfill').style.width = (100*n/ids.length) + '%'; }
prog();
document.addEventListener('click', async e => {
  const b = e.target.closest('button.copy');
  if (b) { const t = clip[+b.dataset.i];
    try { await navigator.clipboard.writeText(t); }
    catch (err) { const v = b.closest('.f,.mini').querySelector('.val, span span:last-child') || b.closest('.f,.mini');
      const r = document.createRange(); r.selectNodeContents(b.closest('.f') ? b.closest('.f').querySelector('.val') : b.parentElement.firstElementChild);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    b.classList.add('ok'); b.textContent = 'Kopyalandı'; setTimeout(()=>{b.classList.remove('ok'); b.textContent='Kopyala';}, 1500); return; }
  const d = e.target.closest('button.done-btn');
  if (d) { const id = d.dataset.step; done[id] = !done[id]; store.set(done);
    const el = document.getElementById(id); el.classList.toggle('done', !!done[id]);
    d.textContent = done[id] ? '✓ Tamamlandı' : 'Tamamlandı olarak işaretle';
    if (done[id]) { el.open = false; const nx = el.nextElementSibling; if (nx) nx.open = true; } prog(); }
});
const first = ids.find(i=>!done[i]); if (first) document.getElementById(first).open = true;
</script>
