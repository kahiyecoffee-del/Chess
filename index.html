<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Checkmate Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
</head>
<body>
<div id="app">

  <!-- Harita -->
  <section id="screen-map" class="screen map-screen">
    <div id="map-scroll" class="map-scroll"><div class="map-track"></div></div>
    <header class="topbar">
      <div class="chip lives" data-lives>
        <span class="lives-heart" data-heart></span>
        <b class="lives-count" data-lives-count>5</b>
        <span class="lives-timer" data-lives-timer>Full</span>
      </div>
      <button class="icon-btn" type="button" data-open-settings></button>
    </header>
    <div class="map-bottom">
      <button id="btn-map-play" class="btn btn-primary wide" type="button"><span data-play-icon></span><span id="map-play-label">Play level 1</span></button>
    </div>
  </section>

  <!-- Oyun -->
  <section id="screen-game" class="screen game-screen" hidden>
    <div class="mesh" aria-hidden="true"></div>
    <canvas id="board" aria-label="Chess board"></canvas>
    <header class="topbar">
      <button id="btn-back" class="icon-btn" type="button"></button>
      <div class="chip level-chip"><span id="level-label">Level</span><b id="level-num">1</b></div>
      <div class="topbar-end">
        <div class="chip lives compact" data-lives>
          <span class="lives-heart" data-heart></span>
          <b class="lives-count" data-lives-count>5</b>
        </div>
        <button class="icon-btn" type="button" data-open-settings></button>
      </div>
    </header>
    <div class="goal-card">
      <div id="goal-text" class="goal-text">Checkmate in 1 move</div>
      <div class="goal-meta">
        <span class="side"><span id="side-swatch" class="swatch"></span><span id="side-label">You play White</span></span>
        <span id="tries" class="tries" role="img" aria-label="3 tries left"></span>
      </div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Your move</div>
    <footer class="game-bottom">
      <div id="move-progress" class="move-progress" aria-label="Moves solved"></div>
    </footer>
  </section>

  <!-- Pencereler -->
  <div id="modal-result" class="modal" hidden>
    <div class="sheet result-sheet">
      <div class="confetti" aria-hidden="true"></div>
      <p id="result-eyebrow" class="eyebrow">Level 1 complete</p>
      <div id="result-stars" class="result-stars"></div>
      <h2 id="result-title" class="sheet-title">Perfect!</h2>
      <p id="result-detail" class="sheet-text">No mistakes</p>
      <div class="sheet-actions">
        <button id="btn-next" class="btn btn-primary" type="button">Next level</button>
        <button id="btn-result-map" class="btn btn-secondary" type="button">Map</button>
      </div>
    </div>
  </div>

  <div id="modal-tries" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-icon rose" aria-hidden="true"><span data-heart></span></div>
      <h2 id="tries-title" class="sheet-title">Out of tries!</h2>
      <p id="tries-text" class="sheet-text"></p>
      <div class="sheet-actions">
        <button id="btn-ad-tries" class="btn btn-success" type="button"><span data-video-icon></span><span id="ad-tries-label">Watch ad</span></button>
        <button id="btn-give-up" class="btn btn-secondary" type="button"><span id="give-up-label">Give up</span><small id="give-up-note">Costs 1 life</small></button>
      </div>
      <p id="tries-note" class="sheet-note" hidden></p>
    </div>
  </div>

  <div id="modal-nolives" class="modal" hidden>
    <div class="sheet">
      <div class="sheet-icon" aria-hidden="true"><span data-clock></span></div>
      <h2 id="nolives-title" class="sheet-title">No lives left</h2>
      <p id="nolives-text" class="sheet-text"></p>
      <div class="sheet-actions">
        <button id="btn-ad-life" class="btn btn-success" type="button"><span data-video-icon></span><span id="ad-life-label">Watch ad: +1 life</span></button>
        <button id="btn-nolives-ok" class="btn btn-secondary" type="button">OK</button>
      </div>
      <p id="nolives-note" class="sheet-note" hidden></p>
    </div>
  </div>

  <div id="modal-leave" class="modal" hidden>
    <div class="sheet">
      <h2 id="leave-title" class="sheet-title">Leave this level?</h2>
      <p id="leave-text" class="sheet-text"></p>
      <div class="sheet-actions">
        <button id="btn-stay" class="btn btn-primary" type="button">Keep playing</button>
        <button id="btn-leave" class="btn btn-secondary" type="button">Leave</button>
      </div>
    </div>
  </div>

  <div id="modal-settings" class="modal" hidden>
    <div class="sheet settings-sheet">
      <div class="sheet-head">
        <h2 id="settings-title" class="sheet-title">Settings</h2>
        <button id="btn-settings-close" class="icon-btn" type="button"></button>
      </div>
      <div class="settings-list">
        <label class="setting" for="set-music">
          <span class="setting-icon" data-music-icon></span>
          <span id="set-music-label" class="setting-label">Music</span>
          <input id="set-music" class="switch" type="checkbox" role="switch">
        </label>
        <label class="setting" for="set-language">
          <span class="setting-icon" data-globe-icon></span>
          <span id="set-language-label" class="setting-label">Language</span>
          <span class="select-wrap"><select id="set-language"></select><span data-chevron></span></span>
        </label>
      </div>
      <p id="credits" class="sheet-note muted"></p>
    </div>
  </div>

  <div id="modal-promo" class="modal" hidden>
    <div class="sheet">
      <p id="promo-title" class="eyebrow">Promote to</p>
      <div class="promo-row">
        <button type="button" data-promo="5" aria-label="Queen">♛</button>
        <button type="button" data-promo="4" aria-label="Rook">♜</button>
        <button type="button" data-promo="3" aria-label="Bishop">♝</button>
        <button type="button" data-promo="2" aria-label="Knight">♞</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
