<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Checkmate Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
</head>
<body>
<div id="app">

  <!-- Harita -->
  <section id="screen-map" class="screen map-screen">
    <div id="map-scroll" class="map-scroll"><div class="map-track"></div></div>
    <header class="map-top">
      <div class="lives-pill" data-lives>
        <span class="lives-heart"><span data-heart></span><b data-lives-count>5</b></span>
        <span class="lives-timer" data-lives-timer>Full</span>
      </div>
      <div class="brand"><span class="brand-mark">♚</span><span class="brand-text">Checkmate<b>Quest</b></span></div>
    </header>
    <div class="map-bottom">
      <button id="btn-map-play" class="btn btn-gold big" type="button"><span data-play-icon></span><span id="map-play-label">Play level 1</span></button>
    </div>
  </section>

  <!-- Oyun -->
  <section id="screen-game" class="screen game-screen" hidden>
    <div class="spotlight" aria-hidden="true"></div>
    <canvas id="board" aria-label="Chess board"></canvas>
    <header class="hud-top">
      <button id="btn-back" class="round-btn" type="button" aria-label="Map"></button>
      <div class="level-pill"><span id="level-label">Level</span> <b id="level-num">1</b></div>
      <div class="lives-pill small" data-lives>
        <span class="lives-heart"><span data-heart></span><b data-lives-count>5</b></span>
      </div>
    </header>
    <div class="goal-card">
      <div id="goal-text" class="goal-text">Checkmate in 1 move</div>
      <div class="goal-meta">
        <span class="side"><span id="side-swatch" class="swatch"></span><span id="side-label">You play White</span></span>
        <span id="tries" class="tries" role="img" aria-label="3 tries left"></span>
      </div>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">Your move</div>
    <footer class="hud-bottom">
      <div id="move-progress" class="move-progress" aria-label="Moves solved"></div>
    </footer>
  </section>

  <!-- Pencereler -->
  <div id="modal-result" class="modal" hidden>
    <div class="card result-card">
      <div class="confetti" aria-hidden="true"></div>
      <div class="ribbon"><span id="result-ribbon">Level complete</span></div>
      <div id="result-stars" class="result-stars"></div>
      <h2 id="result-title" class="card-title">Great job!</h2>
      <p id="result-detail" class="card-text">Solved with no mistakes</p>
      <div class="card-actions">
        <button id="btn-next" class="btn btn-gold" type="button">Next level</button>
        <button id="btn-result-map" class="btn btn-ghost" type="button">Map</button>
      </div>
    </div>
  </div>

  <div id="modal-tries" class="modal" hidden>
    <div class="card">
      <div class="card-emblem sad" aria-hidden="true"><span data-heart-broken></span></div>
      <h2 id="tries-title" class="card-title">Out of tries!</h2>
      <p id="tries-text" class="card-text"></p>
      <div class="card-actions">
        <button id="btn-ad-tries" class="btn btn-green" type="button"><span data-video-icon></span><span id="ad-tries-label">Watch ad</span></button>
        <button id="btn-give-up" class="btn btn-ghost" type="button"><span id="give-up-label">Give up</span><small id="give-up-note">Costs 1 life</small></button>
      </div>
      <p id="tries-note" class="card-note" hidden></p>
    </div>
  </div>

  <div id="modal-nolives" class="modal" hidden>
    <div class="card">
      <div class="card-emblem" aria-hidden="true"><span data-clock></span></div>
      <h2 id="nolives-title" class="card-title">No lives left</h2>
      <p id="nolives-text" class="card-text"></p>
      <div class="card-actions">
        <button id="btn-ad-life" class="btn btn-green" type="button"><span data-video-icon></span><span id="ad-life-label">Watch ad: +1 life</span></button>
        <button id="btn-nolives-ok" class="btn btn-ghost" type="button">OK</button>
      </div>
      <p id="nolives-note" class="card-note" hidden></p>
    </div>
  </div>

  <div id="modal-leave" class="modal" hidden>
    <div class="card">
      <h2 id="leave-title" class="card-title">Leave this level?</h2>
      <p id="leave-text" class="card-text"></p>
      <div class="card-actions">
        <button id="btn-stay" class="btn btn-gold" type="button">Keep playing</button>
        <button id="btn-leave" class="btn btn-ghost" type="button">Leave</button>
      </div>
    </div>
  </div>

  <div id="modal-promo" class="modal" hidden>
    <div class="card">
      <p id="promo-title" class="card-eyebrow">Promote to</p>
      <div class="promo-row">
        <button type="button" data-promo="5" aria-label="Queen">♛</button>
        <button type="button" data-promo="4" aria-label="Rook">♜</button>
        <button type="button" data-promo="3" aria-label="Bishop">♝</button>
        <button type="button" data-promo="2" aria-label="Knight">♞</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
